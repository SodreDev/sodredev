<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" font-family="'DejaVu Sans Mono','Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#060a10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec4ff"/><stop offset="0.5" stop-color="#3ad67f"/><stop offset="1" stop-color="#2ec4ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ec4ff" stop-opacity="0.16"/><stop offset="1" stop-color="#2ec4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="4" y="4" width="992" height="202" rx="14"/></clipPath>
    <style>
      @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:0} }
      @keyframes drift { 0%{opacity:.20} 50%{opacity:.5} 100%{opacity:.20} }
      @keyframes scan { 0%{transform:translateY(-10px)} 100%{transform:translateY(210px)} }
      .cur { animation: blink 1.05s steps(1) infinite; }
      .grid { animation: drift 6s ease-in-out infinite; }
      .scan { animation: scan 6s linear infinite; }
    </style>
  </defs>

  <rect x="4" y="4" width="992" height="202" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <ellipse cx="500" cy="105" rx="520" ry="150" fill="url(#halo)"/>
    <g class="grid" stroke="#12496b" stroke-width="1">
      <line x1="0" y1="42" x2="1000" y2="42"/><line x1="0" y1="84" x2="1000" y2="84"/>
      <line x1="0" y1="126" x2="1000" y2="126"/><line x1="0" y1="168" x2="1000" y2="168"/>
      <line x1="140" y1="0" x2="140" y2="210"/><line x1="860" y1="0" x2="860" y2="210"/>
    </g>
    <rect class="scan" x="0" y="0" width="1000" height="3" fill="#2ec4ff" opacity="0.12"/>

    <text x="52" y="86" font-size="17" xml:space="preserve"><tspan fill="#2ec4ff">┌──(</tspan><tspan fill="#3ad67f">sodre</tspan><tspan fill="#7a97b5">@</tspan><tspan fill="#3ad67f">dev</tspan><tspan fill="#2ec4ff">)-[</tspan><tspan fill="#cdd9e5">~</tspan><tspan fill="#2ec4ff">]</tspan></text>
    <text x="52" y="112" font-size="17" xml:space="preserve"><tspan fill="#2ec4ff">└─</tspan><tspan fill="#3ad67f">$</tspan><tspan fill="#cdd9e5"> whoami</tspan></text>

    <text x="50" y="164" font-size="52" font-weight="bold" fill="#eaf6ff" filter="url(#glow)">Sodré</text>
    <text x="272" y="164" font-size="21" fill="#2ec4ff" filter="url(#glow)">// Backend · Systems · Real-time</text>

    <text x="52" y="192" font-size="13.5" fill="#5f89ad">P2P &amp; WebRTC · end-to-end crypto · security-hardened C++ / Python</text>

    <g font-size="13">
      <text x="702" y="64" fill="#5f89ad">focus</text><text x="812" y="64" fill="#cdd9e5">systems · security</text>
      <text x="702" y="88" fill="#5f89ad">building</text><text x="812" y="88" fill="#cdd9e5">Remix · Concord</text>
      <text x="702" y="112" fill="#5f89ad">stack</text><text x="812" y="112" fill="#cdd9e5">C++ · Python · JS</text>
      <text x="702" y="136" fill="#5f89ad">net</text><text x="812" y="136" fill="#cdd9e5">P2P · E2E · WebRTC</text>
    </g>
    <text x="702" y="170" font-size="14" xml:space="preserve"><tspan fill="#3ad67f">$</tspan><tspan fill="#cdd9e5"> ./architect --then --build</tspan><tspan class="cur" fill="#2ec4ff">▋</tspan></text>
  </g>
  <rect x="4" y="4" width="992" height="202" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.6" opacity="0.85"/>
</svg>
